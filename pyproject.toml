[project]
name = "pdf-merge"
version = "0.1.0"
description = "Auto Dossier – PDF Merger with Google Drive"
authors = [
    {name = "LEMA-UFPB", email = "ufpblema@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.1,<2.0.0",
    "reportlab>=4.4.4,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.0,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "single"
