[project]
name = "pdf-merge"
version = "0.1.0"
description = "Auto Dossier – PDF Merger with Google Drive"
authors = [
    {name = "LEMA-UFPB",email = "ufpblema@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-auth (>=2.15.0,<2.42.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "reportlab (>=4.4.4,<5.0.0)",
    "google-auth-httplib2 (>=0.2.1,<0.3.0)",
    "google-api-python-client (>=2.187.0,<3.0.0)",
    "google-api-core (>=2.28.1,<3.0.0)",
    "google-auth-oauthlib (>=1.2.3,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"

]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false